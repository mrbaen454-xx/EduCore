openapi: 3.0.3
info:
  title: EduCore Academic Management System API
  description: >
    Fondasi REST API EduCore (SIAKAD) - Modular Monolith backend.
    Spesifikasi ini mencakup endpoint diagnostik, health check, serta Autentikasi dan Otorisasi (Fase 05).
  version: 1.1.0
servers:
  - url: http://localhost:8080
    description: Lingkungan Development Lokal

paths:
  /health/live:
    get:
      summary: Liveness Probe
      description: Memeriksa apakah proses server EduCore masih berjalan.
      operationId: getHealthLive
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      responses:
        '200':
          description: Server berjalan normal
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health/ready:
    get:
      summary: Readiness Probe
      description: Memeriksa apakah aplikasi siap menerima traffic HTTP dan database terhubung.
      operationId: getHealthReady
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      responses:
        '200':
          description: Aplikasi siap menerima request
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/health:
    get:
      summary: API v1 Health & Diagnostic
      description: Endpoint diagnostik read-only untuk memverifikasi operasional modul API v1.
      operationId: getAPIV1Health
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      responses:
        '200':
          description: API v1 beroperasi normal
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIV1HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      summary: Login Pengguna
      description: Autentikasi pengguna menggunakan identifier (email/username) dan password. Menerbitkan access token JWT dan refresh token.
      operationId: authLogin
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token
      description: Memperbarui access token yang telah kedaluwarsa dengan mekanisme Refresh Token Rotation.
      operationId: authRefresh
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token berhasil diperbarui
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      summary: Logout Sesi
      description: Mencabut refresh token aktif untuk mengakhiri sesi pengguna.
      operationId: authLogout
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout berhasil dan sesi dicabut
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/me:
    get:
      summary: Profil Pengguna Terautentikasi
      description: Mengambil data profil dan role pengguna yang saat ini sedang login berdasarkan JWT Access Token.
      operationId: getCurrentUserProfile
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      responses:
        '200':
          description: Profil berhasil diambil
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Kirim JWT Access Token pada header Authorization dengan format: Bearer <token>

  parameters:
    XRequestIDHeader:
      name: X-Request-ID
      in: header
      required: false
      description: ID pelacakan request unik dari client (1-64 karakter alfanumerik, dash, underscore).
      schema:
        type: string
        example: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

  headers:
    XRequestID:
      description: ID pelacakan request unik yang diproses oleh server.
      schema:
        type: string
        example: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

  responses:
    BadRequestError:
      description: Request tidak valid atau rusak
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Body request JSON tidak valid atau rusak
            error:
              code: BAD_REQUEST
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    ValidationError:
      description: Validasi field request gagal
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Validasi request gagal
            error:
              code: VALIDATION_ERROR
              details:
                - field: email
                  message: Format 'email' harus berupa alamat email yang valid
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    UnauthorizedError:
      description: Autentikasi gagal atau access token tidak valid / tidak disertakan
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Kredensial tidak valid atau token tidak sah
            error:
              code: INVALID_CREDENTIALS
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    ForbiddenError:
      description: Akses ditolak karena role / izin tidak mencukupi
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Akses ditolak. Role Anda tidak memiliki izin.
            error:
              code: FORBIDDEN
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    NotFoundError:
      description: Route atau resource tidak ditemukan
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Endpoint tidak ditemukan
            error:
              code: ROUTE_NOT_FOUND
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    MethodNotAllowedError:
      description: Metode HTTP tidak didukung pada endpoint ini
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Metode HTTP tidak didukung untuk endpoint ini
            error:
              code: METHOD_NOT_ALLOWED
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    InternalServerError:
      description: Kesalahan internal server yang tidak terduga
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Terjadi kesalahan internal pada server
            error:
              code: INTERNAL_ERROR
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

  schemas:
    SuccessResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Request berhasil diproses
        data:
          type: object
          nullable: true
        meta:
          type: object
          nullable: true

    HealthLiveResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Layanan aplikasi berjalan
        data:
          type: object
          properties:
            status:
              type: string
              example: up
        meta:
          type: object
          nullable: true
          example: null

    HealthReadyResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Layanan aplikasi siap menerima traffic
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            checks:
              type: object
              properties:
                http_server:
                  type: string
                  example: up
                database:
                  type: string
                  example: connected
        meta:
          type: object
          nullable: true
          example: null

    APIV1HealthResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: EduCore API v1 operational
        data:
          type: object
          properties:
            version:
              type: string
              example: 1.1.0
            environment:
              type: string
              example: development
        meta:
          type: object
          nullable: true
          example: null

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email atau username terdaftar
          example: admin@educore.ac.id
        password:
          type: string
          format: password
          description: Password akun (min 8 karakter)
          example: Rahasia123!

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token mentah hex-encoded
          example: e4d909c290d0fb1ca068ffaddf22cbd0a...

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token sesi yang akan dicabut
          example: e4d909c290d0fb1ca068ffaddf22cbd0a...

    UserRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        code:
          type: string
          example: ADMIN
        name:
          type: string
          example: Administrator

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 22222222-2222-2222-2222-222222222222
        username:
          type: string
          example: admin
        email:
          type: string
          example: admin@educore.ac.id
        full_name:
          type: string
          example: Administrator SIAKAD
        status:
          type: string
          example: ACTIVE
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'

    LoginResponseData:
      type: object
      properties:
        access_token:
          type: string
          description: JWT Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Masa berlaku access token dalam satuan detik
          example: 900
        refresh_token:
          type: string
          description: Refresh token rotasi
          example: e4d909c290d0fb1ca068ffaddf22cbd0a...
        user:
          $ref: '#/components/schemas/UserSummary'

    LoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil
        data:
          $ref: '#/components/schemas/LoginResponseData'
        meta:
          type: object
          nullable: true

    TokenRefreshResponseData:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        refresh_token:
          type: string
          example: a1b2c3d4e5f6071829...

    TokenRefreshSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token berhasil diperbarui
        data:
          $ref: '#/components/schemas/TokenRefreshResponseData'
        meta:
          type: object
          nullable: true

    UserProfileSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Data profil berhasil diambil
        data:
          $ref: '#/components/schemas/UserSummary'
        meta:
          type: object
          nullable: true

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Format 'email' harus berupa alamat email yang valid

    ErrorResponse:
      type: object
      required:
        - success
        - message
        - error
        - meta
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validasi request gagal
        error:
          type: object
          required:
            - code
            - details
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
        meta:
          type: object
          nullable: true
          properties:
            request_id:
              type: string
              example: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b
