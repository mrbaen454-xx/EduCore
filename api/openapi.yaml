  /api/v1/student/attendance/classes/{id}:
    get:
      summary: Melihat riwayat presensi pribadi mahasiswa pada kelas tertentu
      operationId: getStudentClassAttendanceHistory
      tags:
        - Mahasiswa Presensi
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Riwayat presensi kelas berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Kirim JWT Access Token pada header Authorization dengan format: Bearer <token>

  parameters:
    XRequestIDHeader:
      name: X-Request-ID
      in: header
      required: false
      description: ID pelacakan request unik dari client (1-64 karakter alfanumerik, dash, underscore).
      schema:
        type: string
        example: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

  headers:
    XRequestID:
      description: ID pelacakan request unik yang diproses oleh server.
      schema:
        type: string
        example: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

  responses:
    BadRequestError:
      description: Request tidak valid atau rusak
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Body request JSON tidak valid atau rusak
            error:
              code: BAD_REQUEST
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    ValidationError:
      description: Validasi field request gagal
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Validasi request gagal
            error:
              code: VALIDATION_ERROR
              details:
                - field: email
                  message: Format 'email' harus berupa alamat email yang valid
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    UnauthorizedError:
      description: Autentikasi gagal atau access token tidak valid / tidak disertakan
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Kredensial tidak valid atau token tidak sah
            error:
              code: INVALID_CREDENTIALS
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    ForbiddenError:
      description: Akses ditolak karena role / izin tidak mencukupi
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Akses ditolak. Role Anda tidak memiliki izin.
            error:
              code: FORBIDDEN
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    NotFoundError:
      description: Route atau resource tidak ditemukan
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Endpoint tidak ditemukan
            error:
              code: ROUTE_NOT_FOUND
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    MethodNotAllowedError:
      description: Metode HTTP tidak didukung pada endpoint ini
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Metode HTTP tidak didukung untuk endpoint ini
            error:
              code: METHOD_NOT_ALLOWED
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    InternalServerError:
      description: Kesalahan internal server yang tidak terduga
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Terjadi kesalahan internal pada server
            error:
              code: INTERNAL_ERROR
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    ConflictError:
      description: Terjadi konflik data atau duplikasi constraint unik
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data dengan kode tersebut sudah digunakan
            error:
              code: CONFLICT
              details: []
            meta:
              request_id: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

  schemas:
    SuccessResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Request berhasil diproses
        data:
          type: object
          nullable: true
        meta:
          type: object
          nullable: true

    HealthLiveResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Layanan aplikasi berjalan
        data:
          type: object
          properties:
            status:
              type: string
              example: up
        meta:
          type: object
          nullable: true
          example: null

    HealthReadyResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Layanan aplikasi siap menerima traffic
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            checks:
              type: object
              properties:
                http_server:
                  type: string
                  example: up
                database:
                  type: string
                  example: connected
        meta:
          type: object
          nullable: true
          example: null

    APIV1HealthResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: EduCore API v1 operational
        data:
          type: object
          properties:
            version:
              type: string
              example: 1.1.0
            environment:
              type: string
              example: development
        meta:
          type: object
          nullable: true
          example: null

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email atau username terdaftar
          example: admin@educore.ac.id
        password:
          type: string
          format: password
          description: Password akun (min 8 karakter)
          example: Rahasia123!

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token mentah hex-encoded
          example: e4d909c290d0fb1ca068ffaddf22cbd0a...

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token sesi yang akan dicabut
          example: e4d909c290d0fb1ca068ffaddf22cbd0a...

    UserRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        code:
          type: string
          example: ADMIN
        name:
          type: string
          example: Administrator

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 22222222-2222-2222-2222-222222222222
        username:
          type: string
          example: admin
        email:
          type: string
          example: admin@educore.ac.id
        full_name:
          type: string
          example: Administrator SIAKAD
        status:
          type: string
          example: ACTIVE
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'

    LoginResponseData:
      type: object
      properties:
        access_token:
          type: string
          description: JWT Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Masa berlaku access token dalam satuan detik
          example: 900
        refresh_token:
          type: string
          description: Refresh token rotasi
          example: e4d909c290d0fb1ca068ffaddf22cbd0a...
        user:
          $ref: '#/components/schemas/UserSummary'

    LoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil
        data:
          $ref: '#/components/schemas/LoginResponseData'
        meta:
          type: object
          nullable: true

    TokenRefreshResponseData:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        refresh_token:
          type: string
          example: a1b2c3d4e5f6071829...

    TokenRefreshSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token berhasil diperbarui
        data:
          $ref: '#/components/schemas/TokenRefreshResponseData'
        meta:
          type: object
          nullable: true

    UserProfileSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Data profil berhasil diambil
        data:
          $ref: '#/components/schemas/UserSummary'
        meta:
          type: object
          nullable: true

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Format 'email' harus berupa alamat email yang valid

    ErrorResponse:
      type: object
      required:
        - success
        - message
        - error
        - meta
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validasi request gagal
        error:
          type: object
          required:
            - code
            - details
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
        meta:
          type: object
          nullable: true
          properties:
            request_id:
              type: string
              example: 9f3c7e4a1b2d8e6f0c4a7b9e1d3f5a8b

    CreateFacultyRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 20
          example: FT
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Fakultas Teknik
        description:
          type: string
          nullable: true
          example: Fakultas teknik dan rekayasa

    UpdateFacultyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    UpdateStatusRequest:
      type: object
      required:
        - is_active
      properties:
        is_active:
          type: boolean
          example: true

    CreateStudyProgramRequest:
      type: object
      required:
        - faculty_id
        - code
        - name
        - level
      properties:
        faculty_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 2
          maxLength: 20
          example: TIF
        name:
          type: string
          maxLength: 255
          example: Teknik Informatika
        level:
          type: string
          enum: [D3, D4, S1, S2, S3, Profesi]
          example: S1
        description:
          type: string
          nullable: true

    UpdateStudyProgramRequest:
      type: object
      properties:
        name:
          type: string
        level:
          type: string
          enum: [D3, D4, S1, S2, S3, Profesi]
        description:
          type: string
          nullable: true

    CreateLecturerRequest:
      type: object
      required:
        - study_program_id
        - nidn
        - name
        - email
      properties:
        study_program_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        nidn:
          type: string
          example: "0012345678"
        name:
          type: string
          example: Joko Susilo
        title_prefix:
          type: string
          nullable: true
          example: Prof. Dr. Ir.
        title_suffix:
          type: string
          nullable: true
          example: M.T.
        email:
          type: string
          format: email
          example: joko@educore.ac.id
        phone:
          type: string
          nullable: true
          example: "081234567890"

    UpdateLecturerRequest:
      type: object
      properties:
        study_program_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        title_prefix:
          type: string
          nullable: true
        title_suffix:
          type: string
          nullable: true
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true

    UpdateLecturerStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LEAVE]
          example: ACTIVE

    CreateStudentRequest:
      type: object
      required:
        - study_program_id
        - nim
        - name
        - email
        - admission_year
      properties:
        study_program_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        nim:
          type: string
          example: "2026101001"
        name:
          type: string
          example: Ananda Putri
        email:
          type: string
          format: email
          example: ananda@student.educore.ac.id
        phone:
          type: string
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE]
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
          example: "2004-08-20"
        admission_year:
          type: integer
          example: 2026

    UpdateStudentRequest:
      type: object
      properties:
        study_program_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE]
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        admission_year:
          type: integer

    UpdateStudentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, PROBATION, GRADUATED, DROPOUT, SUSPENDED]
          example: ACTIVE

    CreateCourseRequest:
      type: object
      required:
        - code
        - name
        - credits
      properties:
        code:
          type: string
          example: "TIF101"
        name:
          type: string
          example: "Algoritma dan Pemrograman"
        description:
