      summary: Melihat detail sesi perkuliahan
      operationId: getSessionDetail
      tags:
        - Presensi
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail sesi perkuliahan berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Memperbarui metadata sesi perkuliahan
      operationId: updateClassSession
      tags:
        - Presensi
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Sesi perkuliahan berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sessions/{id}/close:
    post:
      summary: Menutup sesi perkuliahan
      operationId: closeClassSession
      tags:
        - Presensi
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sesi perkuliahan berhasil ditutup
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sessions/{id}/students:
    get:
      summary: Melihat daftar mahasiswa peserta sesi (roster)
      operationId: getSessionStudents
      tags:
        - Presensi
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daftar peserta sesi berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sessions/{id}/attendance:
