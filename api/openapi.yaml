  /api/v1/sessions/{id}/attendance/{attendanceId}:
    patch:
      summary: Mengoreksi catatan presensi mahasiswa individual
      operationId: updateAttendanceRecord
      tags:
        - Presensi
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
