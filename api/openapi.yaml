openapi: 3.0.3
info:
  title: EduCore Academic Management System API
  description: >
    Fondasi REST API EduCore (SIAKAD) - Modular Monolith backend.
    Spesifikasi ini mencakup endpoint diagnostik, health check, Autentikasi dan Otorisasi (Fase 05),
    Data Master Akademik: Fakultas, Program Studi, Dosen, dan Mahasiswa (Fase 06),
    Mata Kuliah dan Kurikulum (Fase 07),
    Penawaran Kelas dan Jadwal Perkuliahan (Fase 08),
    serta KRS (Kartu Rencana Studi) dan Registrasi Mahasiswa (Fase 09),
    serta Presensi dan Kehadiran Mahasiswa (Fase 10).
  version: 1.6.0
servers:
  - url: http://localhost:8080
    description: Lingkungan Development Lokal

paths:
  /health/live:
    get:
      summary: Liveness Probe
      description: Memeriksa apakah proses server EduCore masih berjalan.
      operationId: getHealthLive
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      responses:
        '200':
          description: Server berjalan normal
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health/ready:
    get:
      summary: Readiness Probe
      description: Memeriksa apakah aplikasi siap menerima traffic HTTP dan database terhubung.
      operationId: getHealthReady
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      responses:
        '200':
          description: Aplikasi siap menerima request
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/health:
    get:
      summary: API v1 Health & Diagnostic
      description: Endpoint diagnostik read-only untuk memverifikasi operasional modul API v1.
      operationId: getAPIV1Health
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      responses:
        '200':
          description: API v1 beroperasi normal
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIV1HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      summary: Login Pengguna
      description: Autentikasi pengguna menggunakan identifier (email/username) dan password. Menerbitkan access token JWT dan refresh token.
      operationId: authLogin
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token
      description: Memperbarui access token yang telah kedaluwarsa dengan mekanisme Refresh Token Rotation.
      operationId: authRefresh
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token berhasil diperbarui
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      summary: Logout Sesi
      description: Mencabut refresh token aktif untuk mengakhiri sesi pengguna.
      operationId: authLogout
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout berhasil dan sesi dicabut
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/me:
    get:
      summary: Profil Pengguna Terautentikasi
      description: Mengambil data profil dan role pengguna yang saat ini sedang login berdasarkan JWT Access Token.
      operationId: getCurrentUserProfile
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      responses:
        '200':
          description: Profil berhasil diambil
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/faculties:
    post:
      summary: Membuat Fakultas Baru
      description: Menambahkan fakultas baru ke sistem. Memerlukan role admin atau akademik.
      operationId: createFaculty
      tags:
        - Faculties
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFacultyRequest'
      responses:
        '201':
          description: Fakultas berhasil dibuat
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Mendapatkan Daftar Fakultas
      description: Menampilkan daftar fakultas dengan filter, pagination, dan sorting.
      operationId: listFaculties
      tags:
        - Faculties
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: search
          in: query
          description: Pencarian nama atau kode fakultas
          schema:
            type: string
        - name: is_active
          in: query
          description: Filter status aktif
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, code, created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Daftar fakultas berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/faculties/{id}:
    get:
      summary: Mendapatkan Detail Fakultas
      description: Menampilkan detail fakultas berdasarkan ID beserta jumlah program studi terdaftar.
      operationId: getFacultyDetail
      tags:
        - Faculties
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail fakultas berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Memperbarui Data Fakultas
      description: Memperbarui informasi nama dan deskripsi fakultas.
      operationId: updateFaculty
      tags:
        - Faculties
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFacultyRequest'
      responses:
        '200':
          description: Fakultas berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/faculties/{id}/status:
    patch:
      summary: Mengubah Status Aktif Fakultas
      description: Mengaktifkan atau menonaktifkan status operasional fakultas.
      operationId: updateFacultyStatus
      tags:
        - Faculties
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status fakultas berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/study-programs:
    post:
      summary: Membuat Program Studi Baru
      description: Mendaftarkan program studi di bawah naungan fakultas aktif.
      operationId: createStudyProgram
      tags:
        - Study Programs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudyProgramRequest'
      responses:
        '201':
          description: Program studi berhasil dibuat
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Mendapatkan Daftar Program Studi
      description: Menampilkan daftar prodi dengan filter fakultas, jenjang, dan status aktif.
      operationId: listStudyPrograms
      tags:
        - Study Programs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: search
          in: query
          schema:
            type: string
        - name: faculty_id
          in: query
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          schema:
            type: string
            enum: [D3, D4, S1, S2, S3, Profesi]
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, code, level, created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Daftar prodi berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/study-programs/{id}:
    get:
      summary: Mendapatkan Detail Program Studi
      operationId: getStudyProgramDetail
      tags:
        - Study Programs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail program studi berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Memperbarui Program Studi
      operationId: updateStudyProgram
      tags:
        - Study Programs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudyProgramRequest'
      responses:
        '200':
          description: Program studi berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/study-programs/{id}/status:
    patch:
      summary: Mengubah Status Aktif Program Studi
      operationId: updateStudyProgramStatus
      tags:
        - Study Programs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status prodi berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/lecturers:
    post:
      summary: Mendaftarkan Profil Dosen
      operationId: createLecturer
      tags:
        - Lecturers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLecturerRequest'
      responses:
        '201':
          description: Dosen berhasil didaftarkan
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Mendapatkan Daftar Dosen
      operationId: listLecturers
      tags:
        - Lecturers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: search
          in: query
          schema:
            type: string
        - name: study_program_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, LEAVE]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, nidn, email, created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Daftar dosen berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/lecturers/{id}:
    get:
      summary: Mendapatkan Detail Dosen
      operationId: getLecturerDetail
      tags:
        - Lecturers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail dosen berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Memperbarui Profil Dosen
      operationId: updateLecturer
      tags:
        - Lecturers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLecturerRequest'
      responses:
        '200':
          description: Profil dosen berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/lecturers/{id}/status:
    patch:
      summary: Mengubah Status Kepegawaian Dosen
      operationId: updateLecturerStatus
      tags:
        - Lecturers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLecturerStatusRequest'
      responses:
        '200':
          description: Status dosen berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/students:
    post:
      summary: Mendaftarkan Profil Mahasiswa
      operationId: createStudent
      tags:
        - Students
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Mahasiswa berhasil didaftarkan
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Mendapatkan Daftar Mahasiswa
      operationId: listStudents
      tags:
        - Students
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: search
          in: query
          schema:
            type: string
        - name: study_program_id
          in: query
          schema:
            type: string
            format: uuid
        - name: admission_year
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, PROBATION, GRADUATED, DROPOUT, SUSPENDED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, nim, email, admission_year, created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Daftar mahasiswa berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/students/{id}:
    get:
      summary: Mendapatkan Detail Mahasiswa
      operationId: getStudentDetail
      tags:
        - Students
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail mahasiswa berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Memperbarui Biodata Mahasiswa
      operationId: updateStudent
      tags:
        - Students
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentRequest'
      responses:
        '200':
          description: Mahasiswa berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

