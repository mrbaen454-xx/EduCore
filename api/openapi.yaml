          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttendanceRequest'
      responses:
        '200':
          description: Catatan presensi berhasil diperbarui
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/student/attendance:
    get:
      summary: Melihat riwayat presensi pribadi mahasiswa
      operationId: getStudentAttendanceHistory
      tags:
        - Mahasiswa Presensi
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIDHeader'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Riwayat presensi berhasil diambil
        '401':
          $ref: '#/components/responses/UnauthorizedError'
